name: Temporary helmet model export

on:
  push:
    paths:
      - ".github/workflows/temp-helmet-model-export.yml"

permissions:
  contents: read

jobs:
  export-models:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install export dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "ultralytics==8.4.79" "onnx>=1.17,<2" "onnxslim>=0.1.59"

      - name: Download public helmet weights
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p model_bundle/pt
          curl --fail --location --retry 5 --retry-all-errors \
            "https://huggingface.co/iam-tsr/yolov8n-helmet-detection/resolve/main/best.pt?download=true" \
            --output model_bundle/pt/helmet_yolov8n.pt
          curl --fail --location --retry 5 --retry-all-errors \
            "https://huggingface.co/nnsohamnn/helmet-detection-yolo11/resolve/main/yolov11m%28100epochs%29.pt?download=true" \
            --output model_bundle/pt/rider_yolo11m.pt
          sha256sum model_bundle/pt/*.pt | tee model_bundle/SHA256SUMS-PT.txt
          ls -lh model_bundle/pt

      - name: Export fixed 960-pixel ONNX models
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json
          import shutil
          from ultralytics import YOLO

          root = Path("model_bundle")
          out_dir = root / "onnx"
          out_dir.mkdir(parents=True, exist_ok=True)

          models = [
              (root / "pt" / "helmet_yolov8n.pt", "helmet_yolov8n_960.onnx"),
              (root / "pt" / "rider_yolo11m.pt", "rider_yolo11m_960.onnx"),
          ]

          metadata = {}
          for weight_path, output_name in models:
              model = YOLO(str(weight_path))
              key = weight_path.stem
              metadata[key] = {
                  "source_weight": weight_path.name,
                  "classes": {str(k): v for k, v in model.names.items()},
                  "imgsz": 960,
              }
              exported = Path(model.export(
                  format="onnx",
                  imgsz=960,
                  opset=12,
                  simplify=True,
                  dynamic=False,
                  batch=1,
                  device="cpu",
              ))
              destination = out_dir / output_name
              shutil.move(str(exported), destination)
              print(f"Exported {weight_path.name} -> {destination}")

          (root / "model_metadata.json").write_text(
              json.dumps(metadata, indent=2, ensure_ascii=False),
              encoding="utf-8",
          )
          PY
          sha256sum model_bundle/onnx/*.onnx | tee model_bundle/SHA256SUMS-ONNX.txt
          ls -lh model_bundle/onnx

      - name: Upload model bundle
        uses: actions/upload-artifact@v4
        with:
          name: temporary-helmet-model-bundle
          path: model_bundle/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
