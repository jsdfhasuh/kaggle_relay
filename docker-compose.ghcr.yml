services:
  kaggle-relay:
    # Use this file only with an explicitly verified immutable tag or digest.
    # Live recovery-sensitive deploys should use docker-compose.yml and build
    # from the local checkout unless the remote image has been confirmed to
    # contain the same code.
    image: ${KAGGLE_RELAY_IMAGE:?set KAGGLE_RELAY_IMAGE to a verified tag or digest}
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      RELAY_STORAGE_DIR: /data
    volumes:
      - ./relay-data:/data
      # Optional: mount Kaggle credentials instead of KAGGLE_API_TOKEN.
      # - ~/.kaggle:/root/.kaggle:ro
    command: sh -c "mkdir -p /tmp/kaggle-config && exec uvicorn app.main:app --host 0.0.0.0 --port 8000"
